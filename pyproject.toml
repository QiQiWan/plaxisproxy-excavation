[build-system]
requires = ["setuptools>=70", "wheel"]   # 建议用 setuptools-scm 管理版本
build-backend = "setuptools.build_meta"

[project]
name = "plaxisproxy_excavation"
version = "1.0.4"                      # Explicit package version
description = "Automation & simulation toolkit for excavation engineering (PLAXIS-driven)."
readme = "readme.md"
requires-python = "~=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Qiwei Wab", email = "i@eatrice.cn" }
]
keywords = ["plaxis", "excavation", "geotech", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

# 公共依赖（纯开源、可从 PyPI 获取的）
dependencies = [
  "shapely==2.0.7",
  # The PLAXIS scripting client must match the installed PLAXIS release.
  # See the separate plaxis2023 extra, or use the V22-bundled client.
  "pykrige>=1.7.3",
  "numpy>=2.0.2",
  "scipy>=1.13.1",
  "matplotlib>=0.1.7",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "ifcopenshell>=0.8.0",   # IFC 导出支持（可选，仅 ifc_exporter 模块需要）
]

[project.optional-dependencies]
plaxis2023 = ["plxscripting==1.0.4"]  # PLAXIS 3D 2023.2 only; NOT V22

dev = ["pytest", "ruff", "mypy", "build", "twine"]
cli = ["typer>=0.12"]      # 如果你的 CLI 需要
# private = []             # 不要把私有库真名写在公共依赖里（详见第三部分）

[project.urls]
Homepage = "https://www.eatrice.cn/post/PlaxisFrameworkOne/"
Repository = "https://github.com/QiQiWan/plaxisproxy-excavation"

[tool.setuptools]
package-dir = {"" = "src"}

# 自动发现包（忽略 tests、examples 等）
[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "examples*", "scripts*"]

