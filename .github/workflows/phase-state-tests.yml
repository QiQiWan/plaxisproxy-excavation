name: Phase state regression tests

on:
  push:
    branches:
      - fix/phase-state-and-import-20261013
  pull_request:
    paths:
      - src/plaxisproxy_excavation/plaxishelper/plaxisrunner.py
      - src/plaxisproxy_excavation/builder/excavation_builder.py
      - tests/test_phase_state_without_solver.py
      - .github/workflows/phase-state-tests.yml

jobs:
  dependency-free-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run phase status logic tests without PLAXIS
        run: python -m unittest discover -s tests -p test_phase_state_without_solver.py -v
