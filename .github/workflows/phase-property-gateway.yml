name: Phase-specific API contract

on:
  push:
    branches:
      - feat/phase-specific-property-gateway-20261013
  pull_request:
    paths:
      - src/plaxisproxy_excavation/plaxishelper/phase_properties.py
      - tests/test_phase_property_gateway.py
      - .github/workflows/phase-property-gateway.yml

jobs:
  no-license-api-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate V22-style phase property contract
        run: python -m unittest discover -s tests -p test_phase_property_gateway.py -v
